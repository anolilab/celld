name: Nightly

# Catches what a pull request cannot: a newer compiler that breaks the build
# or adds lints, and advisories published against locked dependencies. The
# long suites from the test-infrastructure tickets join this workflow as they
# land.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  toolchains:
    name: Test (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: nightly-${{ matrix.toolchain }}
      - run: cargo +${{ matrix.toolchain }} test --workspace --locked
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings

  # Never fails on the numbers, which a shared runner is too noisy to gate on,
  # only on a workload with failed requests. The profile is `lab` because `bench` inherits `release`, whose
  # fat LTO takes far longer to build for the same optimization level.
  bench:
    name: End-to-end benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: nightly-bench
      - run: cargo bench -p celld --bench e2e --profile lab --locked
        env:
          CELLD_BENCH_OUT: ${{ runner.temp }}/e2e-bench/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-bench-${{ github.sha }}
          path: ${{ runner.temp }}/e2e-bench/results.json
          if-no-files-found: error
          retention-days: 90

  # Runs the object-store contract suite against each store in
  # crates/celld/tests/stores/compose.yml and writes one line per store to the
  # job summary, which is what the table in docs/testing.md is refreshed from.
  # SeaweedFS is expected to fail: it does not serialize racing conditional
  # writes. Its entry stays so that a release that fixes it shows up here.
  stores:
    name: Store contract (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        provider: [rustfs, seaweedfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.provider == 'seaweedfs' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: nightly-stores
      - name: Run the contract suite
        run: |
          set -o pipefail
          crates/celld/tests/stores/run.sh ${{ matrix.provider }} | tee "$RUNNER_TEMP/stores.log"
      - name: Record the result
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Store contract"
            echo
            tail -n 1 "$RUNNER_TEMP/stores.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit
