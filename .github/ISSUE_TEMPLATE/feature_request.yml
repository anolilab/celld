name: Feature request
description: Propose a change or a missing capability.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, or what breaks when you try.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you propose
      description: The behaviour you want. For a Cloudflare API, link its documentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you use or considered instead.
